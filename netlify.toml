[build]
  command = "npm run build"
  publish = "dist"

# Diz ao `netlify dev` que o Vite deste projeto corre na porta 8080
[dev]
  command = "npm run dev"
  targetPort = 8080
  framework = "#custom"

# SPA: qualquer rota não encontrada serve o index.html (react-router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
